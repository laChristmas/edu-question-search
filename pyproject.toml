[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eqsearch"
version = "0.1.0"
description = "Educational question search: paste a stem or upload a photo. Originals first, then variants (max 3). Matches stem, formula, and figure — not photo background."
readme = "README.md"
keywords = [
  "education",
  "information-retrieval",
  "ocr",
  "math",
  "question-search",
  "fastapi",
  "variant-questions",
]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2.0",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "pillow>=10.0",
  "imagehash>=4.3",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "rapidocr>=2.0",
  "onnxruntime>=1.17",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8"]
sbert = ["sentence-transformers>=3.0"]
vlm = [
  "transformers>=4.49",
  "accelerate>=1.0",
  "qwen-vl-utils>=0.0.10",
]
paddle-vl = ["paddleocr[doc-parser]>=3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
eqsearch = "eqsearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eqsearch = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
